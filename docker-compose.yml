services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fft_secret}
      POSTGRES_DB: ${POSTGRES_DB:-fft_sitereport}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "6012:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fft}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fft}:${POSTGRES_PASSWORD:-fft_secret}@postgres:5432/${POSTGRES_DB:-fft_sitereport}
    volumes:
      - audio_data:/data/audio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6011:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "6010:80"
    depends_on:
      - backend

volumes:
  pgdata:
  audio_data:
